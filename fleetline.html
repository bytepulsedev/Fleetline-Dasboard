<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- demo -->
<title>FleetLine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400..700&display=swap">
<style>
/* Summary tiles with status split bar, filter chips and search, sortable delivery table with row action. */

:root{--bg:#F2F4F7;--surface:#FDFEFE;--fg:#121A26;--muted:#4F5A69;--line:#D4DAE2;--accent:#1A56C4;--accent-fg:#FFFFFF;--warn:#9A5B00;--ok:#0B7A52;--bad:#B3261E;--fd:'IBM Plex Sans',system-ui,sans-serif;--fb:'IBM Plex Sans',system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E131B;--surface:#171E29;--fg:#E6EAF0;--muted:#A9B1BC;--line:#2B3440;--accent:#7FB0FF;--accent-fg:#0E131B;--warn:#F0B35A;--ok:#4FD6A0;--bad:#FF9A90;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E131B;--surface:#171E29;--fg:#E6EAF0;--muted:#A9B1BC;--line:#2B3440;--accent:#7FB0FF;--accent-fg:#0E131B;--warn:#F0B35A;--ok:#4FD6A0;--bad:#FF9A90;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.demo{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding-block:10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.demo a{color:var(--accent);font-weight:600;text-decoration:none}
.brandbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:16px}
.brand{font-family:var(--fd);font-weight:700;font-size:22px;text-decoration:none}
.brandbar nav{display:flex;gap:4px;flex-wrap:wrap}
.brandbar nav a{padding:6px 10px;font-size:14px;color:var(--muted);text-decoration:none;border-radius:8px}
.brandbar nav a:hover{color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font:600 15px var(--fb);text-decoration:none;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
section{padding-block:60px;border-top:1px solid var(--line)}
.head{display:grid;gap:12px;margin-bottom:32px;max-width:60ch}
.head h2{font-size:clamp(28px,4vw,42px)}
.head p{color:var(--muted)}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:13px;font-weight:600}
input,select,textarea{font:inherit;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.ok{padding:16px;border-radius:12px;border:1px solid var(--ok);color:var(--fg);background:var(--bg)}
.ok b{color:var(--ok)}
footer{border-top:1px solid var(--line);padding-block:28px 36px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 14px var(--fb);padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media(max-width:900px){.two{grid-template-columns:1fr}}
@media(max-width:600px){section{padding-block:44px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}


.top{padding-block:28px 8px;display:grid;gap:6px}
.top h1{font-size:clamp(28px,4vw,40px)}
.top p{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-block:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:2px;min-width:0}
.tile span{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile strong{font:700 34px var(--fd);font-variant-numeric:tabular-nums}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line);margin-bottom:20px}
.split i{display:block;height:100%}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.ctrl input{max-width:260px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
th button{all:unset;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid currentColor}
.pill.transit{color:var(--accent)}.pill.delayed{color:var(--warn)}.pill.delivered{color:var(--ok)}
.empty{padding:24px;color:var(--muted)}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}

</style>
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap demo"><span>Demo project by BytePulseDev. All names and data are made up.</span><a href="index.html" target="_blank" rel="noopener">BytePulseDev portfolio ↗</a></div>
<main class="wrap"><div class="top"><p class="eyebrow">Dispatch dashboard</p><h1>FleetLine</h1><p>Today's deliveries across the city. Filter by status, search by driver, and mark a delivery done.</p></div><div class="tiles" id="tiles"></div><div class="split" id="split" aria-hidden="true"></div><div class="ctrl"><div class="chips" id="flt" role="group" aria-label="Filter by status"></div><label for="q" style="max-width:260px;width:100%"><span class="eyebrow">Search</span><input id="q" type="search" placeholder="ID, customer or driver"></label></div><div class="tw"><table><thead><tr><th>ID</th><th>Customer</th><th>Route</th><th>Driver</th><th aria-sort="ascending"><button type="button" id="sortEta">ETA ↑</button></th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p class="eyebrow" style="margin-top:14px" id="count"></p></main>
<footer class="wrap"><span>© 2026 FleetLine · Demo website</span><span>Built by <a href="index.html" target="_blank" rel="noopener">BytePulseDev</a></span></footer>

<script>
(function(){
  var D=[{"id": "FL-2041", "c": "Hamdard Pharma", "r": "Port Qasim \u2192 Korangi", "dr": "Imran Ali", "eta": 640, "s": "transit"}, {"id": "FL-2042", "c": "Nova Textiles", "r": "SITE \u2192 Clifton", "dr": "Bilal Shah", "eta": 675, "s": "delayed"}, {"id": "FL-2043", "c": "Metro Mart", "r": "Korangi \u2192 Gulshan", "dr": "Saad Khan", "eta": 710, "s": "transit"}, {"id": "FL-2044", "c": "Crescent Foods", "r": "Landhi \u2192 DHA", "dr": "Zain Malik", "eta": 570, "s": "delivered"}, {"id": "FL-2045", "c": "Blue Line Auto", "r": "Port Qasim \u2192 Nazimabad", "dr": "Adeel Raza", "eta": 740, "s": "transit"}, {"id": "FL-2046", "c": "Sunrise Bakery", "r": "Gulshan \u2192 Saddar", "dr": "Haris Mir", "eta": 605, "s": "delivered"}, {"id": "FL-2047", "c": "Orbit Electronics", "r": "SITE \u2192 Tariq Road", "dr": "Fahad Jan", "eta": 780, "s": "delayed"}, {"id": "FL-2048", "c": "Greenleaf Pharmacy", "r": "Korangi \u2192 North Karachi", "dr": "Imran Ali", "eta": 850, "s": "transit"}, {"id": "FL-2049", "c": "Zaitoon Oil", "r": "Landhi \u2192 Malir", "dr": "Owais Baig", "eta": 595, "s": "delivered"}, {"id": "FL-2050", "c": "City Hardware", "r": "SITE \u2192 Orangi", "dr": "Sami Qureshi", "eta": 930, "s": "transit"}, {"id": "FL-2051", "c": "Pearl Stationers", "r": "Saddar \u2192 Clifton", "dr": "Haris Mir", "eta": 765, "s": "transit"}, {"id": "FL-2052", "c": "Hilal Dairy", "r": "Malir \u2192 DHA Phase 6", "dr": "Zain Malik", "eta": 960, "s": "transit"}];
  var st='all',q='',asc=true;
  var LAB={transit:'In transit',delayed:'Delayed',delivered:'Delivered'},ICO={transit:'●',delayed:'▲',delivered:'✓'};
  function hm(m){var h=Math.floor(m/60),n=m%60;return (h<10?'0':'')+h+':'+(n<10?'0':'')+n;}
  function counts(){var c={transit:0,delayed:0,delivered:0};D.forEach(function(d){c[d.s]++;});return c;}
  function drawTop(){
    var c=counts(),t=document.getElementById('tiles');t.innerHTML='';
    [['In transit',c.transit],['Delayed',c.delayed],['Delivered',c.delivered],['All deliveries',D.length]].forEach(function(x){
      var d=document.createElement('div');d.className='tile';
      var a=document.createElement('span');a.textContent=x[0];var b=document.createElement('strong');b.textContent=x[1];
      d.appendChild(a);d.appendChild(b);t.appendChild(d);
    });
    var sp=document.getElementById('split');sp.innerHTML='';
    [['transit','var(--accent)'],['delayed','var(--warn)'],['delivered','var(--ok)']].forEach(function(x){
      var i=document.createElement('i');i.style.width=(c[x[0]]/D.length*100)+'%';i.style.background=x[1];sp.appendChild(i);
    });
  }
  function drawFlt(){
    var f=document.getElementById('flt');f.innerHTML='';
    [['all','All'],['transit','In transit'],['delayed','Delayed'],['delivered','Delivered']].forEach(function(x){
      var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x[1];
      b.setAttribute('aria-pressed',st===x[0]?'true':'false');
      b.addEventListener('click',function(){st=x[0];drawFlt();drawRows();});f.appendChild(b);
    });
  }
  function drawRows(){
    var rows=document.getElementById('rows');rows.innerHTML='';
    var list=D.filter(function(d){
      return (st==='all'||d.s===st)&&(q===''||(d.id+' '+d.c+' '+d.dr).toLowerCase().indexOf(q)>-1);
    }).sort(function(a,b){return asc?a.eta-b.eta:b.eta-a.eta;});
    list.forEach(function(d){
      var tr=document.createElement('tr');
      [d.id,d.c,d.r,d.dr,hm(d.eta)].forEach(function(v,i){
        var td=document.createElement('td');td.textContent=v;if(i===0||i===4)td.className='mono';tr.appendChild(td);
      });
      var s=document.createElement('td'),p=document.createElement('span');p.className='pill '+d.s;p.textContent=ICO[d.s]+' '+LAB[d.s];s.appendChild(p);tr.appendChild(s);
      var a=document.createElement('td');
      if(d.s!=='delivered'){
        var b=document.createElement('button');b.type='button';b.className='btn small';b.textContent='Mark delivered';
        b.addEventListener('click',function(){d.s='delivered';drawTop();drawRows();});a.appendChild(b);
      }
      tr.appendChild(a);rows.appendChild(tr);
    });
    if(!list.length){var tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=7;td.className='empty';td.textContent='No deliveries match.';tr.appendChild(td);rows.appendChild(tr);}
    document.getElementById('count').textContent=list.length+' of '+D.length+' deliveries shown';
  }
  document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();drawRows();});
  document.getElementById('sortEta').addEventListener('click',function(e){asc=!asc;e.target.textContent='ETA '+(asc?'↑':'↓');e.target.parentNode.setAttribute('aria-sort',asc?'ascending':'descending');drawRows();});
  drawTop();drawFlt();drawRows();
})();
</script>
</body>
</html>
